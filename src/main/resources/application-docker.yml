server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://url-shortener-postgres:5432/url_shortener?options=-c%20TimeZone=Asia/Kolkata
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Flyway owns the schema (db/migration). Hibernate only checks the entities match it and refuses
      # to start if they do not. Never switch back to update/create.
      ddl-auto: validate
    show-sql: false
  data:
    redis:
      host: my-redis
      port: 6379
  kafka:
    bootstrap-servers: url-shortner-kafka-1:9092
    listener:
      # Started by KafkaListenerStarter once Kafka is reachable, so a Kafka outage can't stop the app booting.
      auto-startup: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Never let Kafka stall a redirect: cap how long send() may block on metadata or a full buffer
        # (Kafka default 60 s). ClickEventProducer falls back to counting in Redis when this is hit.
        max.block.ms: 500
        # Give up on undeliverable events sooner (defaults: 30 s / 120 s) so the fallback runs promptly.
        # delivery.timeout.ms must be >= linger.ms + request.timeout.ms.
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      group-id: analytics-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

app:
  base-url: http://localhost:8081/

logging:
  level:
    # Kafka clients log their whole config (~400 lines) at INFO on every start; keep warnings and errors.
    org.apache.kafka: warn
    # Per-click and cache hit/miss logs are DEBUG; set APP_LOG_LEVEL=DEBUG to see them.
    com.subhranil.url_shortner: ${APP_LOG_LEVEL:INFO}
    # application.yml (always loaded) turns SQL logging on for local runs; keep it off in Docker.
    org.hibernate.SQL: info
